[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trojan-compass"
version = "0.2.0"
description = "Stateless Trojan Compass backend and shared campus/career graph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "uvicorn>=0.34,<1",
    "python-dotenv>=1,<2",
    "neo4j>=5.28,<7",
    "tzdata>=2024.1",
    "pypdf>=7.1,<8",
    "defusedxml>=0.7,<1",
]

[project.scripts]
trojan-compass-import = "trojan_compass.ingestion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trojan_compass"]

[tool.hatch.build.targets.wheel.force-include]
"data/seed/usc.json" = "trojan_compass/data/usc.json"
"data/seed/career_paths.json" = "trojan_compass/data/career_paths.json"
"data/usc/catalog.json" = "trojan_compass/data/catalog.json"
"data/usc/campus_kb.json" = "trojan_compass/data/campus_kb.json"
"data/seed/university.json.gz" = "trojan_compass/data/university.json.gz"
"data/seed/university_report.json" = "trojan_compass/data/university_report.json"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "mypy>=1.15,<3", "ruff>=0.11,<1"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
