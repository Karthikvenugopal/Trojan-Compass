name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest pytest-asyncio mypy ruff
      - run: pytest -q
      - run: mypy src tests
      - run: ruff check src tests
      - run: ruff format --check src tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_USE_MOCK_API: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e .
      - run: python -m venv --system-site-packages .venv
      - run: npm ci --prefix frontend
      - name: Verify actual servers, frontend proxy and shutdown
        shell: bash
        run: |
          printf 'COMPASS_MODE=demo\n' > .env
          bash -n scripts/dev.sh
          bash scripts/dev.sh > /tmp/compass-startup.log 2>&1 &
          launcher_pid=$!
          trap 'kill -TERM "$launcher_pid" 2>/dev/null || true; wait "$launcher_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import httpx
          with httpx.Client(trust_env=False, timeout=1) as client:
              deadline = time.monotonic() + 45
              while time.monotonic() < deadline:
                  try:
                      frontend = client.get('http://127.0.0.1:5173')
                      if frontend.status_code == 200:
                          break
                  except httpx.HTTPError:
                      pass
                  time.sleep(0.25)
              else:
                  raise SystemExit('Frontend did not start')
              health = client.get('http://127.0.0.1:5173/health')
              assert health.status_code == 200
              assert health.json()['mode'] == 'demo'
              origin = 'http://localhost:5173'
              preflight = client.options('http://127.0.0.1:8000/api/chat', headers={
                  'Origin': origin, 'Access-Control-Request-Method': 'POST',
                  'Access-Control-Request-Headers': 'content-type',
              })
              assert preflight.status_code == 200
              assert preflight.headers['access-control-allow-origin'] == origin
              first = client.post('http://127.0.0.1:5173/api/chat', json={
                  'messages': [{'role': 'user', 'content': 'Hi'}],
              }).json()
              required = ['direction', 'study_stage', 'program', 'work_experience', 'completed_courses']
              assert first['recommendations'] == []
              assert first['information']['missing_fields'] == required
              history = []
              for index, (field, value) in enumerate([
                  ('direction', 'programming'), ('study_stage', 'Undergraduate'),
                  ('program', None), ('work_experience', None), ('completed_courses', None),
              ]):
                  history.append({'role': 'user', 'content': f'Update {field}: {value or "None"}',
                      'edit': {'field': field, 'status': 'provided' if value else 'none', 'value': value}})
                  reply = client.post('http://127.0.0.1:5173/api/chat', json={'messages': history})
                  assert reply.status_code == 200
                  assert reply.headers['cache-control'] == 'no-store'
                  assert reply.json()['information']['missing_fields'] == required[index + 1:]
                  if index < 4:
                      assert reply.json()['recommendations'] == []
              assert reply.json()['information']['ready']
              assert reply.json()['recommendations']
              direct = client.post('http://127.0.0.1:8000/api/chat', headers={'Origin': origin},
                  json={'messages': history})
              assert direct.status_code == 200
              assert direct.headers['access-control-allow-origin'] == origin
          print('Actual frontend, backend and proxied chat request passed.')
          PY
          kill -TERM "$launcher_pid"
          wait "$launcher_pid" || test "$?" -eq 143
          trap - EXIT
          python - <<'PY'
          import socket
          import time
          for port in (8000, 5173):
              for attempt in range(20):
                  with socket.socket() as client:
                      if client.connect_ex(('127.0.0.1', port)) != 0:
                          break
                  time.sleep(0.1)
              else:
                  raise SystemExit(f'Port {port} remained open after shutdown')
          print('Both servers stopped cleanly.')
          PY
      - name: Verify dummy chat mode without provider credentials
        shell: bash
        run: |
          bash scripts/check-system.sh
          bash scripts/dev.sh --diagnostic > /tmp/compass-dummy.log 2>&1 &
          launcher_pid=$!
          trap 'kill -TERM "$launcher_pid" 2>/dev/null || true; wait "$launcher_pid" 2>/dev/null || true' EXIT
          python - <<'PYTHON'
          import time
          import httpx
          with httpx.Client(trust_env=False, timeout=1) as client:
              deadline = time.monotonic() + 45
              while time.monotonic() < deadline:
                  try:
                      health = client.get('http://127.0.0.1:5173/health')
                      if health.status_code == 200 and health.json()['mode'] == 'diagnostic':
                          break
                  except (httpx.HTTPError, ValueError):
                      pass
                  time.sleep(0.25)
              else:
                  raise SystemExit('Diagnostic mode did not start')
              response = client.post('http://127.0.0.1:5173/api/chat', json={
                  'messages': [{'role': 'user', 'content': 'Synthetic test message'}],
              })
              assert response.status_code == 200
              assert 'Gemini was not called' in response.json()['message']
              assert response.json()['recommendations'] == []
              dummy = client.get('http://127.0.0.1:5173/api/diagnostics/dummy')
              assert dummy.status_code == 200
              assert dummy.json()['message'] == response.json()['message']
          print('Dummy chat and dummy endpoint passed through actual frontend proxy.')
          PYTHON
      - name: Show startup diagnostics on failure
        if: failure()
        run: cat /tmp/compass-startup.log /tmp/compass-dummy.log 2>/dev/null || true
  graph:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026.10.2
        env:
          NEO4J_AUTH: neo4j/integration-test-only
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p integration-test-only 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest pytest-asyncio
      - run: python -m pytest tests/test_live_graph.py -q
        env:
          COMPASS_TEST_NEO4J: '1'
