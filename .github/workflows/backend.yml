name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest pytest-asyncio mypy ruff
      - run: pytest -q
      - run: mypy src tests
      - run: ruff check src tests
      - run: ruff format --check src tests
