name: Refresh shared USC data
on:
  workflow_dispatch:
  push:
    branches: [feat/university-coverage]
    paths:
      - src/trojan_compass/public_import.py
      - .github/workflows/public-data.yml
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m trojan_compass.public_import
      - uses: actions/upload-artifact@v4
        with:
          name: shared-usc-snapshot
          path: |
            data/seed/university.json.gz
            data/seed/university_report.json
      - name: Commit reviewed public metadata to feature branch
        if: github.ref == 'refs/heads/feat/university-coverage'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/seed/university.json.gz data/seed/university_report.json
          git diff --cached --quiet || git commit -m 'data: refresh official public USC course and event metadata'
          git push
