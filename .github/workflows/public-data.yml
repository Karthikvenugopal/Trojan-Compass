name: Refresh shared USC data
on:
  workflow_dispatch:
  push:
    branches: [feat/university-coverage]
    paths:
      - scripts/probe_public_sources.py
      - .github/workflows/public-data.yml
permissions:
  contents: read
jobs:
  inspect-public-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe_public_sources.py
